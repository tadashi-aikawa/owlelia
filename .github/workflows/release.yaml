name: "Release"
on: workflow_dispatch
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # nodeとpnpmはmise.tomlのものを使う。npmのtrusted publishingもこのnodeのnpmで行う
      - uses: jdx/mise-action@v5
        with:
          install_args: "node pnpm"
      - name: "Build"
        run: |
          pnpm install
          pnpm pre:push
          pnpm build
      # presetのconventional-changelog-conventionalcommitsは、devDependenciesのものをlockどおりに使う
      # ここでpnpm addすると、package.jsonとlockの両方が書き換わる
      # @semantic-release/gitの既定ではpackage.jsonだけがリリースコミットに入るので、lockとずれる
      # v10はrelease notesが空になるバグがあるため、devDependenciesではv9に留める
      # https://github.com/semantic-release/release-notes-generator/issues/992
      - name: "Release"
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
