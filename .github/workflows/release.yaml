name: "Release"
on: workflow_dispatch
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: "Build"
        run: |
          npm i -g pnpm@11.0.8
          pnpm install
          pnpm pre:push
          pnpm build
      # conventionalcommits v10はrelease notesが空になるバグがあるため9.3.1に固定
      # https://github.com/semantic-release/release-notes-generator/issues/992
      - name: "Prepare release"
        run: pnpm add -D conventional-changelog-conventionalcommits@9.3.1
      - name: "Release"
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
