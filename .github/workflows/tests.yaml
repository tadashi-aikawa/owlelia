name: "Tests"

on:
  push:
    paths:
      - ".github/**/*"
      - "src/*"
      - "src/**/*"
      - "*.js"
      - "*.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]
    name: Node ${{ matrix.node }}
    env:
      # pnpmはmise.tomlのまま使い、nodeだけを行ごとに差し替える
      MISE_NODE_VERSION: ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "node pnpm"
          # 既定のcacheのkeyはMISE_NODE_VERSIONを含まないので、行ごとに分ける
          cache_key_prefix: mise-v1-node${{ matrix.node }}
      - name: "Install -> Test -> Build"
        run: |
          pnpm install
          pnpm pre:push
          pnpm build
      - uses: codecov/codecov-action@v7
        if: "matrix.node == '22' && success()"
        with:
          files: ./coverage/clover.xml
